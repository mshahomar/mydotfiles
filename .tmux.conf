### Author: 0ms
### Prerequisites: On macOS, install `osx-cpu-temp` via Homebrew for CPU temperature display. On Linux, ensure `sensors` is installed for CPU temperature. Don't forget Nerd Fonts for the powerline symbols to display correctly.

# Fix colors: Ensure Ghostty passes true color support cleanly to tmux
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Global status bar background (Matches the dark background hole)
set -g status-style bg=#1e1e24,fg=#ffffff
set -g status-interval 5

# ====================================================================
# DYNAMIC LEFT SIDE STATUS
# ====================================================================
# 1. Base settings: Remove all default rectangular backgrounds completely
set -g status-style bg=#1e1e24,fg=#ffffff
set -g window-status-separator ""

# 2. Hostname block: Green background text ending with a green chevron
set -g status-left "#[bg=#00c853,fg=#000000,bold] #H | #S #[bg=#3f4b5a,fg=#00c853,nobold]"
set -g status-left-length 50

# 3. Standard Inactive Tabs (Stays a subtle, dark slate gray)
set -g window-status-style bg=#1e1e24
set -g window-status-format "#[bg=#3f4b5a,fg=#a0aab7] #I #W #[bg=#1e1e24,fg=#3f4b5a]"

# 4. Active Tab (Bright pronounced background + Bold white text + Indicator icon)
set -g window-status-current-style bg=#1e1e24
set -g window-status-current-format "#[bg=#589ed6,fg=#3f4b5a]#[fg=#ffffff,bold] ● #I #W* #[bg=#1e1e24,fg=#589ed6,nobold]"


# ====================================================================
# DYNAMIC RIGHT SIDE STATUS
# ====================================================================
set -g status-right "#[fg=#ff4081,bg=#1e1e24]#[bg=#ff4081,fg=#ffffff] #(pmset -g batt | grep -q 'AC Power' && echo '🔌 AC' || echo '🔋 Batt') #[fg=#00e5ff,bg=#ff4081]#[bg=#00e5ff,fg=#000000] #(networksetup -listallhardwareports | grep -B 1 $(route -n get default 2>/dev/null | awk '/interface:/{print $2}') | awk '/Hardware Port:/{print $3}') #[fg=#ffb300,bg=#00e5ff]#[bg=#ffb300,fg=#000000] 🌡️ #(osx-cpu-temp) "

set -g status-right-length 150

